apiVersion: tunnel.tunnel.io/v1alpha1
kind: RegistryProxy
metadata:
  name: reg-1
  namespace: tunnels
  labels:
    app.kubernetes.io/name: cloud-nexus-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  clientRef:
    name: spoke-client           # Name of an existing NexusClient in this namespace.
  remotePort: 15000              # Port frps will expose on the hub side.
  serviceAccountName: registry-proxy-sa  # SA annotated with WI/IRSA.
  # proxyPort: 5000              # Optional; default 5000.
  # image:                       # Optional; inherits from NexusClient image.
  #   repository: asia-southeast3-docker.pkg.dev/crd-operations/crd-gitops/crd-tunnel
  #   tag: "1.0.0"

# After applying:
#   docker pull reg-1-docker.tunnels.svc.cluster.local/asia-southeast3-docker.pkg.dev/my-image:tag
#
# The NexusServer must have enableOperatorPlugin: true.
# Example NexusServer patch:
#   spec:
#     enableOperatorPlugin: true
#     operatorWebhookAddr: "cloud-nexus-operator-controller-manager-frps-plugin.cloud-nexus-operator-system.svc.cluster.local:9090"
