apiVersion: apps/v1
kind: Deployment
metadata:
  name: frps-webhook
  namespace: crd-tunnel-system
  labels:
    app: frps-webhook
    app.kubernetes.io/name: cloud-nexus-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frps-webhook
  template:
    metadata:
      labels:
        app: frps-webhook
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frps-webhook
        command:
        - /frps-webhook
        args:
        - --health-probe-bind-address=:8082
        image: asia-southeast3-docker.pkg.dev/crd-operations/crd-gitops/crd-tunnel-webhook:1.0.3
        ports:
        - containerPort: 9090
          name: frps-plugin
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: frps-webhook
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: controller-manager-frps-plugin
  namespace: crd-tunnel-system
  labels:
    app: frps-webhook
    app.kubernetes.io/name: cloud-nexus-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app: frps-webhook
  ports:
  - name: frps-plugin
    port: 9090
    targetPort: 9090
    protocol: TCP
