#       kind: Deployment
#       metadata:
#         name: cloud-nexus-operator-controller-manager
#       spec:
#         template:
#           spec:
#             containers:
#             - name: manager
#               env:
#               - name: TUNNEL_IMAGE
#                 value: "<your-registry>/crd-tunnel:<your-tag>"
