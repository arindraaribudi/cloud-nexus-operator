---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tunnel.tunnel.io
  resources:
  - frpclients
  - frpproxies
  - frpservers
  - registryproxies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tunnel.tunnel.io
  resources:
  - frpclients/finalizers
  - frpproxies/finalizers
  - frpservers/finalizers
  - registryproxies/finalizers
  verbs:
  - update
- apiGroups:
  - tunnel.tunnel.io
  resources:
  - frpclients/status
  - frpproxies/status
  - frpservers/status
  - registryproxies/status
  verbs:
  - get
  - patch
  - update
